
name: Collect public news and indicators

on:
  schedule:
    - cron: '0 22,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect news and indicators
        run: python world-intelligence/scripts/collect.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-intelligence/data/latest.json world-intelligence/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public news and indicators"
            git push
          fi
